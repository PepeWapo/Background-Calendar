<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
  </style>
</helmet>

<div style="
  width: 1440px; height: 220px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, oklch(9% 0.01 255) 0%, oklch(6% 0.01 255) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 26px;
">

  <div style="display: flex; flex-direction: row; align-items: center; gap: 30px; padding-bottom: 18px;">

    <!-- explorador -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
    </svg>

    <!-- navegador -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"/>
    </svg>

    <!-- terminal -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="2"/>
      <path d="M7 9.5l3 2.5-3 2.5M12.5 14.5h4.5"/>
    </svg>

    <!-- notas / documento -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/>
      <path d="M14 3.5v4h4M8.5 12.5h7M8.5 16h5"/>
    </svg>

    <!-- musica -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l11-2v12"/>
      <circle cx="6.5" cy="18" r="2.5"/>
      <circle cx="17.5" cy="16" r="2.5"/>
    </svg>

    <!-- clima -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 16.5a4 4 0 0 1 .7-7.94 5.5 5.5 0 0 1 10.6 1.8A3.8 3.8 0 0 1 17.5 16.5z"/>
    </svg>

    <!-- correo -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13" rx="2"/>
      <path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>
    </svg>

    <!-- chat -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5.5h16v10.5H9l-4 3.5v-3.5H4z"/>
    </svg>

    <!-- ajustes -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(88% 0.005 255)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 3v2.2M12 18.8V21M4.9 4.9l1.55 1.55M17.55 17.55L19.1 19.1M3 12h2.2M18.8 12H21M4.9 19.1l1.55-1.55M17.55 6.45L19.1 4.9"/>
    </svg>

  </div>

  <div style="display: flex; flex-direction: row; align-items: center; gap: 22px;">

    <!-- suspender -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(60% 0.005 255)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
    </svg>

    <!-- reiniciar -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(60% 0.005 255)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 1 1 2.6 5.9"/>
      <path d="M4 17.5V13h4.5"/>
    </svg>

    <!-- apagar -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(60% 0.005 255)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5v8"/>
      <path d="M7 6.2a8 8 0 1 0 10 0"/>
    </svg>

  </div>

</div>
</x-dc>
</body>
</html>
